<!doctype html>
<html><head><meta charset="utf-8"><title>PRICE IT e2e</title>
<style>body{font:12px monospace;background:#111;color:#ddd;margin:0}
#log{padding:12px;white-space:pre-wrap}iframe{width:420px;height:760px;border:1px solid #333}
#frames{display:flex;flex-wrap:wrap;gap:4px;padding:8px}#hostwrap iframe{width:1280px;height:720px}</style>
</head><body>
<pre id="log">running…</pre>
<div id="hostwrap"></div>
<div id="frames"></div>
<script>
var L=[],FAIL=0;
function log(s){L.push(s);document.getElementById('log').textContent=L.join('\n');}
function ok(cond,msg,extra){ if(cond){log('PASS  '+msg);} else {FAIL++;log('FAIL  '+msg+(extra?('  ['+extra+']'):''));} }
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function loadFrame(container,src){
  return new Promise(function(res){
    var f=document.createElement('iframe'); f.src=src;
    f.onload=function(){ setTimeout(function(){res(f);},120); };
    container.appendChild(f);
  });
}
function D(f){return f.contentDocument;}
function txt(f){return (D(f).body.innerText||D(f).body.textContent||'').replace(/\s+/g,' ');}
function vis(f,id){var e=D(f).getElementById(id);return !!e && !e.hidden && e.offsetParent!==null;}
function click(f,id){D(f).getElementById(id).click();}

var NAMES=[['luis','Luis'],['hc','HC'],['koi','Koi'],['xiaomi','小米'],['chile','Chile'],
           ['ruth','Ruth'],['tina','Tina'],['haley','Haley'],['william','William'],['bonnie','Bonnie']];
var IDS=NAMES.map(function(x){return x[0];});
var P={}, HOST=null;

async function pickName(f,id){
  var btns=D(f).querySelectorAll('.namebtn');
  for(var i=0;i<btns.length;i++){ if(btns[i].getAttribute('data-id')===id){ btns[i].click(); await sleep(60); return true; } }
  return false;
}
async function typePrice(f,price){
  var inp=D(f).getElementById('priceInput');
  inp.value=String(price);
  inp.dispatchEvent(new f.contentWindow.Event('input',{bubbles:true}));
  click(f,'btnLock');
  await sleep(110);
}
async function choose(id){
  var btns=D(HOST).querySelectorAll('.pickbtn');
  for(var i=0;i<btns.length;i++){ if(btns[i].getAttribute('data-id')===id){ btns[i].click(); await sleep(280); return true; } }
  return false;
}
function prog(){ return D(HOST).getElementById('progN').textContent.trim(); }
function cards(row){ return D(HOST).getElementById(row).querySelectorAll('.card').length; }
async function actual(v){
  var ai=D(HOST).getElementById('actualInput');
  ai.value=String(v); ai.dispatchEvent(new HOST.contentWindow.Event('input',{bubbles:true}));
  click(HOST,'btnActual'); await sleep(340);
}

async function run(){
  try{ for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i); if(k.indexOf('priceit.')===0) localStorage.removeItem(k);} }catch(e){}
  try{ sessionStorage.clear(); }catch(e){}

  HOST=await loadFrame(document.getElementById('hostwrap'),'host.html');
  ok(vis(HOST,'gate'),'host 先出現 PIN 畫面');
  D(HOST).getElementById('pinInput').value='9999'; click(HOST,'pinBtn'); await sleep(80);
  ok(vis(HOST,'gate'),'錯誤 PIN 無法進入');
  D(HOST).getElementById('pinInput').value='0926'; click(HOST,'pinBtn'); await sleep(250);
  ok(vis(HOST,'stage')&&!vis(HOST,'gate'),'PIN 0926 進入 host');
  ok(vis(HOST,'viewLobby'),'host 顯示 lobby');
  ok(D(HOST).getElementById('qrbox')===null,'★ QR Code 已移除');
  ok(/play\.html/.test(D(HOST).getElementById('joinUrl').textContent),'加入網址仍自動產生');
  ok(D(HOST).getElementById('lobbyRoster').querySelectorAll('.chip').length===10,'★ 名單是 10 人',
     D(HOST).getElementById('lobbyRoster').querySelectorAll('.chip').length+'');

  await new Promise(function(res){ HOST.onload=function(){setTimeout(res,220);}; HOST.contentWindow.location.reload(); });
  ok(!vis(HOST,'gate')&&vis(HOST,'viewLobby'),'★ 重新整理後畫面正常（不是全白）');

  var frames=document.getElementById('frames');
  for(var n=0;n<NAMES.length;n++){
    try{ localStorage.removeItem('priceit.me'); }catch(e){}
    var f=await loadFrame(frames,'play.html');
    ok(await pickName(f,NAMES[n][0]),'手機 '+(n+1)+' 選擇 '+NAMES[n][1]);
    P[NAMES[n][0]]=f;
  }
  await sleep(260);
  ok(D(HOST).getElementById('lobbyRoster').querySelectorAll('.chip.in').length===10,'host 看到 10 人加入',
     D(HOST).getElementById('lobbyRoster').querySelectorAll('.chip.in').length+'');
  var first2=Array.prototype.slice.call(D(P.koi).querySelectorAll('.namebtn'),0,2)
               .map(function(b){return b.getAttribute('data-id');});
  ok(first2[0]==='luis'&&first2[1]==='hc','★ Luis 與 HC 排在名單最前面',first2.join(','));

  click(HOST,'btnStart'); await sleep(250);
  ok(vis(HOST,'viewPicking'),'★ START ROUND 後出現「這一輪是誰的禮物？」');
  ok(D(HOST).querySelectorAll('.pickbtn').length===10,'選擇畫面列出 10 個人');
  ok(D(HOST).querySelector('.pickbtn.suggest').getAttribute('data-id')==='luis','預設建議第一位還沒分享的人');
  ok(vis(P.koi,'viewStandby'),'挑選期間手機顯示 standby');
  ok(/主持人正在選/.test(txt(P.koi)),'手機說明文字正確');

  ok(await choose('tina'),'★ 主持人挑選 Tina（不照預設順序）');
  ok(vis(HOST,'viewCollect'),'進入 collecting');
  ok(/Tina/.test(D(HOST).getElementById('presenterLabel').textContent),'大螢幕顯示 THIS ROUND Tina');
  ok(D(HOST).getElementById('progD').textContent.trim()==='/ 9','★ 分母是 9',
     D(HOST).getElementById('progD').textContent);
  ok(vis(P.tina,'viewPresenter'),'★ Tina 手機顯示 YOU 是分享者');
  ok(!vis(P.tina,'viewGuess'),'分享者沒有輸入框');
  ok(vis(P.luis,'viewGuess'),'Luis 看到出價畫面');

  var prices={luis:2680,hc:3500,koi:1980,xiaomi:4200,chile:2500,ruth:5000,haley:3200,william:2900,bonnie:3100};
  var order=IDS.filter(function(x){return x!=='tina';});
  for(var i2=0;i2<5;i2++){ await typePrice(P[order[i2]],prices[order[i2]]); }
  await sleep(220);
  ok(prog()==='5','5 人送出後顯示 5 / 9','got '+prog());
  var ht=txt(HOST);
  ok(ht.indexOf('2,680')<0&&ht.indexOf('3,500')<0,'Reveal 前 host 看不到價格');
  ok(txt(P.luis).indexOf('3,500')<0,'Reveal 前參加者看不到別人的價格');

  for(var i3=5;i3<order.length;i3++){ await typePrice(P[order[i3]],prices[order[i3]]); }
  await sleep(240);
  ok(prog()==='9','全部送出後顯示 9 / 9','got '+prog());
  ok(/ALL LOCKED IN/.test(txt(HOST)),'顯示 ALL LOCKED IN');

  click(HOST,'btnReveal'); await sleep(320);
  ok(cards('row1')===5&&cards('row2')===4,'★ 9 張卡 = 第一排 5 + 第二排 4',cards('row1')+'+'+cards('row2'));
  var hw=HOST.contentWindow;
  var sizes=[[1920,1080],[1600,900],[1366,768],[1280,720],[1024,640]];
  for(var s=0;s<sizes.length;s++){
    HOST.style.width=sizes[s][0]+'px'; HOST.style.height=sizes[s][1]+'px';
    await sleep(170);
    var dh=hw.document.documentElement.scrollHeight, dw=hw.document.documentElement.scrollWidth;
    ok(dh<=hw.innerHeight+2&&dw<=hw.innerWidth+2,'★ 9 張卡一頁裝得下 @'+sizes[s][0]+'x'+sizes[s][1],
       'h '+dh+'/'+hw.innerHeight+' w '+dw+'/'+hw.innerWidth);
  }
  HOST.style.width='1280px'; HOST.style.height='720px'; await sleep(170);

  await actual(2880);
  var wins=D(HOST).querySelectorAll('.card.win');
  ok(wins.length===1&&/William/.test(wins[0].textContent),'最接近的是 William (2,900 vs 2,880)',
     wins.length?wins[0].textContent.slice(0,30):'-');
  ok(/20/.test(D(HOST).getElementById('sumDiff').textContent),'DIFFERENCE = 20',
     D(HOST).getElementById('sumDiff').textContent);

  click(HOST,'btnNext'); await sleep(340);
  ok(vis(HOST,'viewPicking'),'NEXT ROUND 後回到挑選畫面');
  ok(D(HOST).getElementById('roundLabel').textContent.indexOf('02')>-1,'進入 ROUND 02');
  var tinaBtn=D(HOST).querySelector('.pickbtn[data-id="tina"]');
  ok(tinaBtn.className.indexOf('used')>-1&&/已分享/.test(tinaBtn.textContent),'★ Tina 標記為已分享');
  ok(vis(P.tina,'viewStandby'),'手機同步回到 standby（未 refresh）');

  ok(await choose('bonnie'),'第 2 輪挑選 Bonnie');
  ok(vis(P.bonnie,'viewPresenter'),'★ Bonnie 變成分享者（未 refresh）');
  ok(vis(P.tina,'viewGuess'),'★ Tina 這輪回到出價畫面（未 refresh）');
  ok(!/2,900/.test(txt(P.tina)),'上一輪價格已清除');

  click(HOST,'btnRepick'); await sleep(220);
  ok(vis(HOST,'viewPicking'),'★ collecting 中可按「換分享者」回到挑選');
  ok(await choose('haley'),'改成 Haley');
  ok(vis(P.haley,'viewPresenter'),'Haley 變成分享者');
  ok(vis(P.bonnie,'viewGuess'),'Bonnie 回到出價畫面');
  click(HOST,'btnRepick'); await sleep(220);
  var bb=D(HOST).querySelector('.pickbtn[data-id="bonnie"]');
  ok(bb.className.indexOf('used')<0,'★ 被換掉的 Bonnie 不會被誤記成已分享');
  ok(await choose('haley'),'再次確認 Haley');

  var others2=IDS.filter(function(x){return x!=='haley';});
  await typePrice(P[others2[0]],900);
  await typePrice(P[others2[1]],1100);
  for(var i4=2;i4<others2.length;i4++){ await typePrice(P[others2[i4]],9000); }
  await sleep(240);
  click(HOST,'btnReveal'); await sleep(260);
  await actual(1000);
  ok(D(HOST).querySelectorAll('.card.win').length===2,'差距相同時兩人都是 Winner',
     D(HOST).querySelectorAll('.card.win').length+'');

  click(HOST,'btnNext'); await sleep(320);
  ok(vis(HOST,'viewPicking'),'進入第 3 輪挑選');
  ok(!D(HOST).getElementById('btnFinish').hidden,'★ 挑選畫面有 FINISH GAME');
  click(HOST,'btnFinish'); await sleep(320);
  ok(vis(HOST,'viewFinish'),'★ 可以在任何一輪提早結束');
  ok(/THANKS FOR PLAYING/.test(txt(HOST)),'ENDING 文案正確');
  ok(!D(HOST).getElementById('masterBlock').hidden,'PRICE MASTER 出現');
  ok(vis(P.koi,'viewFinished'),'手機同步進入結束畫面');

  click(HOST,'btnReset'); await sleep(90);
  D(HOST).getElementById('resetYes').click(); await sleep(400);
  ok(vis(HOST,'viewLobby'),'RESET 後回到 lobby');
  ok(D(HOST).getElementById('lobbyRoster').querySelectorAll('.chip.in').length===10,'RESET 後身份保留');
  click(HOST,'btnStart'); await sleep(260);
  ok(D(HOST).querySelectorAll('.pickbtn.used').length===0,'★ RESET 後「已分享」紀錄也清空');

  log('');
  log(FAIL===0?'ALL PASS ('+(L.length-1)+' checks)':'FAILURES: '+FAIL);
  document.title='E2E '+(FAIL===0?'ALLPASS':('FAIL'+FAIL));
}
run().catch(function(e){ log('EXCEPTION '+e.message+'\n'+e.stack); document.title='E2E EXCEPTION'; });
</script>
</body></html>
