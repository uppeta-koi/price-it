<!doctype html>
<html><head><meta charset="utf-8"><title>PRICE IT e2e</title>
<style>body{font:12px monospace;background:#111;color:#ddd;margin:0}
#log{padding:12px;white-space:pre-wrap}iframe{width:420px;height:760px;border:1px solid #333}
#frames{display:flex;flex-wrap:wrap;gap:4px;padding:8px}#hostwrap iframe{width:1280px;height:720px}</style>
</head><body>
<pre id="log">running…</pre>
<div id="hostwrap"></div>
<div id="frames"></div>
<script>
var L=[],FAIL=0;
function log(s){L.push(s);document.getElementById('log').textContent=L.join('\n');}
function ok(cond,msg,extra){ if(cond){log('PASS  '+msg);} else {FAIL++;log('FAIL  '+msg+(extra?('  ['+extra+']'):''));} }
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function loadFrame(container,src){
  return new Promise(function(res){
    var f=document.createElement('iframe'); f.src=src;
    f.onload=function(){ setTimeout(function(){res(f);},120); };
    container.appendChild(f);
  });
}
function D(f){return f.contentDocument;}
function txt(f){return (D(f).body.innerText||D(f).body.textContent||'').replace(/\s+/g,' ');}
function vis(f,id){var e=D(f).getElementById(id);return !!e && !e.hidden && e.offsetParent!==null;}
function click(f,id){D(f).getElementById(id).click();}

var NAMES=[['koi','Koi'],['xiaomi','小米'],['chile','Chile'],['ruth','Ruth'],['tina','Tina'],
           ['haley','Haley'],['william','William'],['bonnie','Bonnie']];
var P={};   // id -> iframe
var HOST=null;

async function pickName(f,id){
  var btns=D(f).querySelectorAll('.namebtn');
  for(var i=0;i<btns.length;i++){ if(btns[i].getAttribute('data-id')===id){ btns[i].click(); await sleep(60); return true; } }
  return false;
}
async function typePrice(f,price){
  var inp=D(f).getElementById('priceInput');
  inp.value=String(price);
  inp.dispatchEvent(new f.contentWindow.Event('input',{bubbles:true}));
  click(f,'btnLock');
  await sleep(120);
}
function hostProgress(){ return D(HOST).getElementById('progN').textContent.trim(); }
function cardCount(row){ return D(HOST).getElementById(row).querySelectorAll('.card').length; }

async function run(){
  // wipe any previous local state
  try{ for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i); if(k.indexOf('priceit.')===0) localStorage.removeItem(k);} }catch(e){}
  try{ sessionStorage.clear(); }catch(e){}

  /* ---- host ---- */
  HOST=await loadFrame(document.getElementById('hostwrap'),'host.html');
  ok(vis(HOST,'gate'),'host 先出現 PIN 畫面');
  D(HOST).getElementById('pinInput').value='9999'; click(HOST,'pinBtn'); await sleep(80);
  ok(vis(HOST,'gate'),'錯誤 PIN 無法進入 host');
  D(HOST).getElementById('pinInput').value='0926'; click(HOST,'pinBtn'); await sleep(250);
  ok(!vis(HOST,'gate') && vis(HOST,'stage'),'正確 PIN 0926 進入 host');
  ok(vis(HOST,'viewLobby'),'host 顯示 lobby');
  ok(D(HOST).getElementById('qrbox').querySelector('canvas')!=null,'QR code 已產生');
  ok(/play\.html/.test(D(HOST).getElementById('joinUrl').textContent),'加入網址自動產生 (play.html)','got '+D(HOST).getElementById('joinUrl').textContent);

  /* ---- 8 phones join ---- */
  var frames=document.getElementById('frames');
  for(var n=0;n<NAMES.length;n++){
    try{ localStorage.removeItem('priceit.me'); }catch(e){}
    var f=await loadFrame(frames,'play.html');
    var okPick=await pickName(f,NAMES[n][0]);
    ok(okPick,'手機 '+(n+1)+' 選擇 '+NAMES[n][1]);
    P[NAMES[n][0]]=f;
  }
  await sleep(250);
  ok(D(HOST).getElementById('lobbyRoster').querySelectorAll('.chip.in').length===8,'host lobby 看到 8 人加入',
     D(HOST).getElementById('lobbyRoster').querySelectorAll('.chip.in').length+' chips');
  ok(vis(P.koi,'viewStandby'),'開始前參加者顯示 standby');

  /* ================= ROUND 1 ================= */
  click(HOST,'btnStart'); await sleep(250);
  ok(vis(HOST,'viewCollect'),'host 進入 collecting');
  ok(D(HOST).getElementById('progD').textContent.trim()==='/ 7','host 分母是 7',D(HOST).getElementById('progD').textContent);
  ok(vis(P.koi,'viewPresenter'),'R1 分享者 Koi 看到 YOU\'RE UP');
  ok(/YOU'RE UP/.test(txt(P.koi)),'Koi 畫面文字 YOU\'RE UP');
  ok(!vis(P.koi,'viewGuess'),'分享者沒有出價輸入框');
  ok(vis(P.xiaomi,'viewGuess'),'非分享者 小米 看到出價畫面（未 refresh）');

  var prices={xiaomi:3500,chile:2200,ruth:1980,tina:4200,haley:2500,william:5000,bonnie:3200};
  var order=['xiaomi','chile','ruth','tina','haley'];
  for(var i=0;i<order.length;i++){ await typePrice(P[order[i]],prices[order[i]]); }
  await sleep(250);
  ok(hostProgress()==='5','5 人送出後 host 顯示 5 / 7','got '+hostProgress());
  ok(vis(P.xiaomi,'viewLocked'),'送出後手機顯示 LOCKED IN');
  ok(/3,500/.test(txt(P.xiaomi)),'手機顯示自己的鑒價 NT$3,500');

  // leak checks before reveal
  var xt=txt(P.xiaomi);
  ok(xt.indexOf('2,200')<0 && xt.indexOf('1,980')<0 && xt.indexOf('4,200')<0,'Reveal 前參加者看不到別人的價格');
  var ht=txt(HOST);
  ok(ht.indexOf('3,500')<0 && ht.indexOf('2,200')<0 && ht.indexOf('1,980')<0,'Reveal 前 host 看不到任何價格');
  ok(/小米\s*✓/.test(ht)||ht.indexOf('✓')>-1,'Reveal 前 host 看得到誰已完成');

  // edit before reveal
  click(P.chile,'btnEdit'); await sleep(80);
  await typePrice(P.chile,2680);
  ok(/2,680/.test(txt(P.chile)),'Reveal 前可以修改自己的答案');
  await sleep(150);
  ok(hostProgress()==='5','修改後完成人數仍是 5','got '+hostProgress());

  await typePrice(P.william,prices.william);
  await typePrice(P.bonnie,prices.bonnie);
  await sleep(250);
  ok(hostProgress()==='7','全部送出後 host 顯示 7 / 7','got '+hostProgress());
  ok(/ALL LOCKED IN/.test(txt(HOST)),'host 顯示 ALL LOCKED IN');

  /* ---- reveal ---- */
  click(HOST,'btnReveal'); await sleep(350);
  ok(vis(HOST,'viewReveal'),'host 進入 reveal');
  ok(cardCount('row1')===4 && cardCount('row2')===3,'7 張卡 = 第一排 4 + 第二排 3',
     cardCount('row1')+'+'+cardCount('row2'));
  var hw=HOST.contentWindow;
  // 在多種投影解析度下都必須一頁裝得下
  var sizes=[[1920,1080],[1600,900],[1366,768],[1280,720],[1024,640]];
  for(var s=0;s<sizes.length;s++){
    HOST.style.width=sizes[s][0]+'px'; HOST.style.height=sizes[s][1]+'px';
    await sleep(160);
    var dh=hw.document.documentElement.scrollHeight, bh=hw.document.body.scrollHeight,
        dw=hw.document.documentElement.scrollWidth;
    ok(dh<=hw.innerHeight+2 && bh<=hw.innerHeight+2 && dw<=hw.innerWidth+2,
       'Reveal 一頁裝得下 @'+sizes[s][0]+'x'+sizes[s][1],
       'h '+dh+'/'+hw.innerHeight+'  w '+dw+'/'+hw.innerWidth);
    ok(D(HOST).querySelectorAll('.card').length===7,'7 張卡都在 @'+sizes[s][0]+'x'+sizes[s][1]);
  }
  HOST.style.width='1280px'; HOST.style.height='720px'; await sleep(160);
  var rt=txt(HOST);
  ok(/3,500/.test(rt)&&/2,680/.test(rt)&&/5,000/.test(rt),'7 個價格同時出現');
  ok(/1,980/.test(txt(P.koi)),'分享者手機也同步進入 reveal');

  /* ---- actual price ---- */
  var ai=D(HOST).getElementById('actualInput');
  ai.value='2880'; ai.dispatchEvent(new hw.Event('input',{bubbles:true}));
  click(HOST,'btnActual'); await sleep(400);
  var wins=D(HOST).querySelectorAll('.card.win');
  ok(wins.length===1,'只有一位最接近者被 highlight',wins.length+' winners');
  ok(wins.length===1 && /Chile/.test(wins[0].textContent),'最接近的是 Chile (2,680 vs 2,880)',
     wins.length?wins[0].textContent:'-');
  ok(/NT\$2,880/.test(txt(HOST)),'大螢幕顯示 ACTUAL PRICE 2,880');
  ok(/200/.test(D(HOST).getElementById('sumDiff').textContent),'DIFFERENCE 顯示 200',
     D(HOST).getElementById('sumDiff').textContent);
  ok(/2,880/.test(txt(P.tina)),'參加者手機同步看到實際價格');

  /* ---- next round ---- */
  click(HOST,'btnNext'); await sleep(400);
  ok(D(HOST).getElementById('roundLabel').textContent.indexOf('02')>-1,'host 進入 ROUND 02',
     D(HOST).getElementById('roundLabel').textContent);
  ok(hostProgress()==='0','下一輪出價已清空 (0 / 7)','got '+hostProgress());
  ok(vis(P.xiaomi,'viewPresenter'),'R2 分享者 小米 自動變成 YOU\'RE UP（未 refresh）');
  ok(vis(P.koi,'viewGuess'),'Koi 自動回到出價畫面（未 refresh）');
  ok(!/3,500/.test(txt(P.koi)),'上一輪價格已從手機畫面清除');

  /* ================= ROUNDS 2..8 fast ================= */
  for(var r=2;r<=8;r++){
    var pres=['koi','xiaomi','chile','ruth','tina','haley','william','bonnie'][r-1];
    var others=NAMES.map(function(x){return x[0];}).filter(function(id){return id!==pres;});

    if(r===2){
      // 並列情境：兩個人與實際價格差距完全相同 -> 兩個人都是 winner
      await typePrice(P[others[0]],900);
      await typePrice(P[others[1]],1100);
      for(var j2=2;j2<others.length;j2++){ await typePrice(P[others[j2]],5000); }
      await sleep(200);
      click(HOST,'btnReveal'); await sleep(250);
      var aiT=D(HOST).getElementById('actualInput');
      aiT.value='1000'; aiT.dispatchEvent(new hw.Event('input',{bubbles:true}));
      click(HOST,'btnActual'); await sleep(350);
      var tw=D(HOST).querySelectorAll('.card.win');
      ok(tw.length===2,'差距相同時兩個人都算 Winner',tw.length+' winners');
      ok(/\+/.test(D(HOST).getElementById('sumClosest').textContent),'CLOSEST 同時列出兩個名字',
         D(HOST).getElementById('sumClosest').textContent);
      click(HOST,'btnNext'); await sleep(300);
      continue;
    }

    if(r===3){
      // 只有 5 個人出價就 REVEAL：仍要出 7 張卡，未出價顯示 —，且不影響最接近計算
      for(var j3=0;j3<5;j3++){ await typePrice(P[others[j3]],2000+j3*100); }
      await sleep(200);
      ok(hostProgress()==='5','R3 只有 5 人出價');
      click(HOST,'btnReveal'); await sleep(250);
      ok(D(HOST).querySelectorAll('.card').length===7,'未全員出價也是 7 張卡',
         D(HOST).querySelectorAll('.card').length+' cards');
      ok(D(HOST).querySelectorAll('.card.miss').length===2,'2 張卡顯示未出價',
         D(HOST).querySelectorAll('.card.miss').length+' miss');
      var aiM=D(HOST).getElementById('actualInput');
      aiM.value='2000'; aiM.dispatchEvent(new hw.Event('input',{bubbles:true}));
      click(HOST,'btnActual'); await sleep(350);
      var mw=D(HOST).querySelectorAll('.card.win');
      ok(mw.length===1 && !mw[0].classList.contains('miss'),'未出價的人不會被算成最接近');
      click(HOST,'btnNext'); await sleep(300);
      continue;
    }

    for(var j=0;j<others.length;j++){ await typePrice(P[others[j]],1000+j*100); }
    await sleep(200);
    if(hostProgress()!=='7'){ ok(false,'R'+r+' 7/7','got '+hostProgress()); }
    click(HOST,'btnReveal'); await sleep(250);
    var ai2=D(HOST).getElementById('actualInput');
    ai2.value='1000'; ai2.dispatchEvent(new hw.Event('input',{bubbles:true}));
    click(HOST,'btnActual'); await sleep(300);
    click(HOST,'btnNext'); await sleep(300);
  }
  ok(vis(HOST,'viewFinish'),'第 8 輪後顯示 ENDING');
  ok(/FINISHED/.test(txt(HOST))&&/THANKS FOR PLAYING/.test(txt(HOST)),'ENDING 文案正確');
  ok(!D(HOST).getElementById('masterBlock').hidden,'PRICE MASTER 區塊出現');
  ok(/WIN/.test(D(HOST).getElementById('masterWins').textContent),'PRICE MASTER 顯示勝場',
     D(HOST).getElementById('masterName').textContent+' / '+D(HOST).getElementById('masterWins').textContent);
  ok(vis(P.koi,'viewFinished'),'手機同步進入結束畫面');

  /* ---- reset ---- */
  click(HOST,'btnReset'); await sleep(80);
  D(HOST).getElementById('resetYes').click(); await sleep(400);
  ok(vis(HOST,'viewLobby'),'RESET 後回到 lobby');
  ok(D(HOST).getElementById('lobbyRoster').querySelectorAll('.chip.in').length===8,'RESET 後身份仍保留（不用重新加入）');
  ok(vis(P.koi,'viewStandby'),'RESET 後手機回到 standby 而不是重新選名字');

  log('');
  log(FAIL===0?'ALL PASS ('+(L.length-1)+' checks)':'FAILURES: '+FAIL);
  document.title='E2E '+(FAIL===0?'ALLPASS':('FAIL'+FAIL));
}
run().catch(function(e){ log('EXCEPTION '+e.message+'\n'+e.stack); document.title='E2E EXCEPTION'; });
</script>
</body></html>
